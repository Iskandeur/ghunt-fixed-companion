<!doctype html>
<html><head><meta charset="utf-8"><title>ghunt-fixed Companion</title>
<link rel="stylesheet" href="style.css"><style>body{width:300px}</style></head>
<body><div class="wrap">
  <h1>ghunt-fixed Companion</h1>
  <p>1. Run <code>ghunt login</code> and pick option <b>3</b> (listening mode).</p>
  <p>2. Click below and sign in to Google. A fresh token is sent to GHunt automatically.</p>
  <button id="start">Sign in &amp; send to GHunt</button>
  <button id="private" class="secondary">Same, in a private window</button>
  <p id="msg"></p>
  <p style="font-size:12px">Tip: ghunt-fixed can now log in without this extension: <code>ghunt login --browser</code>.</p>
</div><script src="popup.js"></script></body></html>
